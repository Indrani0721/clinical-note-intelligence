name: CI Pipeline

# When does this run?
# On every push to main and every pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    # Why these env vars?
    # Your app needs GROQ_API_KEY and DATABASE_URL to import
    # We use a fake key for testing — we're not making real LLM calls
    # DATABASE_URL points to a test SQLite DB so we don't need PostgreSQL
    env:
      GROQ_API_KEY: test-key-for-ci
      DATABASE_URL: sqlite:///./test.db

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Cache dependencies
      # Why cache? Installing packages takes 60-90 seconds
      # Caching means subsequent runs take 5-10 seconds instead
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx

      # Step 5: Lint with flake8
      # Why lint? Catches obvious errors and enforces code style
      # --max-line-length 100: allows slightly longer lines than default 79
      # --ignore E501: ignore line length for now (can tighten later)
      - name: Lint with flake8
        run: |
          flake8 backend/ frontend/ \
            --max-line-length=100 \
            --ignore=E501,W503,E302,E303 \
            --exclude=__pycache__
        continue-on-error: true
        # Why continue-on-error: true?
        # Linting failures shouldn't block deployment right now
        # Once you clean up the code style, change this to false

      # Step 6: Run tests
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          GROQ_API_KEY: test-key-for-ci
          DATABASE_URL: sqlite:///./test.db

      # Step 7: Build Docker image
      # Why build in CI? Confirms the Dockerfile still works
      # after every change — catches broken builds before deployment
      - name: Build Docker image
        run: |
          docker build -t clinical-note-intelligence:ci .
